<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>
<main class="container wide console">
    <nav th:replace="~{fragments/common :: consolenav('sft')}"></nav>
    <div th:replace="~{fragments/common :: flash}"></div>

    <div class="row-between">
        <h1>SFT examples</h1>
        <div class="new-dpo">
            <form method="post" th:action="@{/sft/new}">
                <button type="submit">New example</button>
            </form>
            <form method="post" th:action="@{/sft/new-from-scenario}" class="seed-form">
                <select name="scenarioId" required>
                    <option value="" disabled selected
                            th:text="${draftProvider} ? '+ generate from scenario (' + ${draftProvider} + ')…' : '+ generate from scenario (manual fallback)…'">scenario…</option>
                    <option th:each="s : ${scenarios}" th:value="${s.id}" th:text="${s.title}">scenario</option>
                </select>
                <button type="submit" class="secondary">Generate</button>
            </form>
        </div>
    </div>

    <nav class="subnav">
        <a th:href="@{/sft(subject=${subjectFilter})}" th:classappend="${activeStatus == null and !staleView} ? 'active'">All</a>
        <a th:each="s : ${statuses}" th:href="@{/sft(status=${s}, subject=${subjectFilter})}"
           th:classappend="${activeStatus == s.name() and !staleView} ? 'active'" th:text="${s}">STATUS</a>
        <a th:if="${staleCount > 0 or staleView}" th:href="@{/sft(stale=true, subject=${subjectFilter})}"
           th:classappend="${staleView} ? 'active'"
           th:text="'Stale (' + ${staleCount} + ')'"
           title="Stage 4 examples whose publish or persona moved on — the next run's SELECT tick archives them (QA-6)">Stale</a>
    </nav>

    <!-- The Stage 4 run-page hand-off: queue faceted to one subject. -->
    <p th:if="${subjectFilter != null}" class="muted" style="margin:-0.8rem 0 1rem;">
        <span class="badge badge--info">SUBJECT</span>
        Stage 4 examples for <strong th:text="${subjectFilterName ?: subjectFilter}">subject</strong>
        &middot; queue pre-sorted FAIL &rarr; BORDERLINE &rarr; PASS
        &middot; <a th:href="@{/sft(status=${activeStatus})}">clear filter</a>
    </p>

    <table class="grid">
        <thead><tr><th>Claim</th><th>Authenticity</th><th>Labels</th><th>Tool?</th><th>Turns</th><th>Judge</th><th>Status</th><th>Updated</th></tr></thead>
        <tbody>
        <tr th:each="e : ${examples}" class="clickable"
            th:attr="data-href=@{/sft/{id}(id=${e.id})}">
            <td th:text="${e.tags.claimType != null ? e.tags.claimType.name().toLowerCase() : ''}">claim</td>
            <td th:text="${e.tags.authenticityTier != null ? e.tags.authenticityTier.name().toLowerCase() : ''}">tier</td>
            <td th:text="${#strings.listJoin(e.tags.labels, ', ')}">labels</td>
            <td th:text="${e.tags.hasToolCall} ? '✓' : ''"></td>
            <td th:text="${e.turns.size()}">0</td>
            <td>
                <span th:if="${e.judgeVerdict != null}" class="badge"
                      th:classappend="${e.judgeVerdict.name() == 'FAIL'} ? 'badge--danger' : (${e.judgeVerdict.name() == 'BORDERLINE'} ? 'badge--warning' : 'badge--success')"
                      th:text="${e.judgeVerdict}">PASS</span>
                <span th:if="${staleIds.contains(e.id)}" class="badge badge--warning"
                      title="Publish or persona moved on — archived on the next SELECT tick">stale</span>
            </td>
            <td><span class="badge" th:classappend="'badge--' + ${#strings.replace(#strings.toLowerCase(e.status),'_','-')}" th:text="${e.status}">DRAFT</span></td>
            <td class="muted"><time class="js-ts" th:datetime="${e.updatedAt}" th:text="${e.updatedAt}">ts</time></td>
        </tr>
        <tr th:if="${examples.isEmpty()}"><td colspan="8"><div class="empty-state">No examples here — Stage 4 runs fill this queue, or create one manually.</div></td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
