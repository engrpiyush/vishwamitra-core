<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>
<main class="container wide console">
    <nav th:replace="~{fragments/common :: consolenav('users')}"></nav>
    <div th:replace="~{fragments/common :: flash}"></div>

    <h1>Operators / Team</h1>
    <p class="muted">Operator accounts (ADMIN / REVIEWER / AUTHOR) — email → role allowlist; only
        active operators may sign in. Member logins live on the
        <a th:href="@{/admin/members}">Members page</a>.</p>

    <table class="grid">
        <thead><tr><th>Email</th><th>Role</th><th>Active</th><th>Added by</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.email}">email</td>
            <td><span class="badge badge--info" th:text="${u.role}">ROLE</span></td>
            <td><span class="badge" th:classappend="${u.active} ? 'badge--success' : 'badge--muted'" th:text="${u.active} ? 'active' : 'inactive'">yes</span></td>
            <td class="muted" th:text="${u.addedBy}">by</td>
            <td>
                <div class="row-actions">
                    <form method="post" th:action="@{'/admin/users/' + ${u.email} + '/active'}">
                        <input type="hidden" name="active" th:value="${!u.active}"/>
                        <button class="btn--ghost btn--sm" type="submit" th:text="${u.active} ? 'Deactivate' : 'Activate'">toggle</button>
                    </form>
                    <form method="post" th:action="@{'/admin/users/' + ${u.email} + '/delete'}"
                          data-confirm="This removes the operator from the allowlist; they will no longer be able to sign in."
                          data-confirm-title="Remove this operator?" data-confirm-ok="Remove" data-confirm-danger>
                        <button class="btn--danger btn--sm" type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${users.isEmpty()}"><td colspan="5"><div class="empty-state">No operators yet — add one below.</div></td></tr>
        </tbody>
    </table>

    <h2>Add / update operator</h2>
    <form method="post" th:action="@{/admin/users}" class="form">
        <label>Email <input type="email" name="email" required placeholder="name@vishwakarma.ai"/></label>
        <label>Role
            <select name="role">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
            </select>
        </label>
        <button type="submit">Save operator</button>
    </form>
</main>
</body>
</html>
