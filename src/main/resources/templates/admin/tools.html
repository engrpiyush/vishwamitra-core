<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>
<main class="container">
    <nav th:replace="~{fragments/common :: adminnav('tools')}"></nav>
    <div th:replace="~{fragments/common :: flash}"></div>

    <h1>Tool catalog</h1>
    <p class="muted">Function signatures available for tool-call turns and tool-aware drafting.</p>

    <table class="grid">
        <thead><tr><th>Name</th><th>Description</th><th>Params</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="t : ${tools}">
            <td><code th:text="${t.name}">name</code></td>
            <td th:text="${t.description}">desc</td>
            <td>
                <span th:each="p : ${t.params}" class="chip">
                    <span th:text="${p.name}">p</span><span class="muted" th:text="${p.required} ? '*' : ''"></span>
                </span>
            </td>
            <td><span class="badge" th:classappend="'badge--' + ${#strings.replace(#strings.toLowerCase(t.status),'_','-')}" th:text="${t.status}">ACTIVE</span></td>
            <td>
                <div class="row-actions">
                    <form method="post" th:action="@{'/admin/tools/' + ${t.id} + '/status'}">
                        <button class="btn--ghost btn--sm" type="submit">Toggle</button>
                    </form>
                    <form method="post" th:action="@{'/admin/tools/' + ${t.id} + '/delete'}"
                          data-confirm="This permanently removes the tool from the catalog."
                          data-confirm-title="Delete this tool?" data-confirm-ok="Delete" data-confirm-danger>
                        <button class="btn--danger btn--sm" type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${tools.isEmpty()}"><td colspan="5"><div class="empty-state">No tools yet — add one below.</div></td></tr>
        </tbody>
    </table>

    <h2>Add tool</h2>
    <form method="post" th:action="@{/admin/tools}" class="form">
        <label>Name <input type="text" name="name" required placeholder="lookup_fact"/></label>
        <label>Description <input type="text" name="description" placeholder="Look up a grounded fact about the subject"/></label>
        <label>Params (one per line: <code>name|type|required|description</code>)
            <textarea name="params" rows="4" placeholder="query|string|true|What to look up&#10;source|string|false|Preferred evidence source"></textarea>
        </label>
        <button type="submit">Create tool</button>
    </form>
</main>
</body>
</html>
