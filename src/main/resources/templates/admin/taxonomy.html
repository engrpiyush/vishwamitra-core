<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>
<main class="container wide console">
    <nav th:replace="~{fragments/common :: consolenav('taxonomy')}"></nav>
    <div th:replace="~{fragments/common :: flash}"></div>

    <h1>Taxonomy</h1>
    <p class="muted">Freeform <strong>labels</strong> suggested on SFT/DPO examples and used to seed
        generation. The fixed dimensions below are enums, set per example.</p>

    <div class="tax-grid">
        <section>
            <h2>Labels</h2>
            <div class="chips">
                <span class="chip" th:each="term : ${taxonomy.labels}">
                    <span th:text="${term}">term</span>
                    <form method="post" th:action="@{/admin/taxonomy/remove}" class="inline-form">
                        <input type="hidden" name="term" th:value="${term}"/>
                        <button class="x" type="submit" title="remove">&times;</button>
                    </form>
                </span>
            </div>
            <form method="post" th:action="@{/admin/taxonomy/add}" class="add-term">
                <input type="text" name="term" placeholder="add label"/>
                <button type="submit">Add</button>
            </form>
        </section>
        <section>
            <h2>Claim type <span class="muted">(fixed)</span></h2>
            <div class="chips">
                <span class="chip" th:each="ct : ${T(ai.vishwakarma.labelling.domain.ClaimType).values()}" th:text="${ct.name().toLowerCase()}">claim</span>
            </div>
            <h2>Authenticity tier <span class="muted">(fixed)</span></h2>
            <div class="chips">
                <span class="chip" th:each="t : ${T(ai.vishwakarma.labelling.domain.AuthenticityTier).values()}" th:text="${t.name().toLowerCase()}">tier</span>
            </div>
        </section>
    </div>
</main>
</body>
</html>
