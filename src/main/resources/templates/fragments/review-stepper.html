<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  §12.6 review progress stepper (5 nodes: Start · Decide · PII · Preview · Submit).
  Usage: <div th:replace="~{fragments/review-stepper :: stepper(${step})}"></div>
  Node states by [step]: n < step = done (green ✓), n == step = active (amber), n > step = pending (grey).
-->
<div th:fragment="stepper(step)"
     style="display:flex; align-items:center; margin:0.4rem 0 1.6rem; font-size:0.78rem;">
    <th:block th:each="label,iter : ${ {'Start','Decide','PII','Preview','Submit'} }"
              th:with="n=${iter.index + 1},
                       done=${n &lt; step},
                       circleBg=${n &lt; step ? '#16a34a' : (n == step ? '#f59e0b' : 'transparent')},
                       circleBorder=${n &lt; step ? '#16a34a' : (n == step ? '#f59e0b' : '#6b7280')},
                       circleColor=${n &lt;= step ? '#0b0b0c' : '#9ca3af'},
                       size=${n == 5 ? '2.5rem' : '2rem'}">
        <div th:if="${!iter.first}"
             th:style="${'height:2px; flex:1; min-width:1.3rem; background:' + (n &lt;= step ? '#16a34a' : '#4b5563') + ';'}"></div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:0.3rem; flex:0 0 auto;">
            <div th:style="${'width:' + size + '; height:' + size + '; border-radius:50%; display:flex;'
                           + ' align-items:center; justify-content:center; font-weight:700; box-shadow:'
                           + (n == 5 ? '0 0 0 3px rgba(22,163,74,0.15)' : 'none')
                           + '; border:2px solid ' + circleBorder + '; background:' + circleBg + '; color:' + circleColor + ';'}">
                <span th:if="${done}">&#10003;</span>
                <span th:unless="${done}" th:text="${n}">1</span>
            </div>
            <span th:text="${label}"
                  th:style="${'letter-spacing:0.02em; color:' + (n &lt;= step ? 'inherit' : '#9ca3af') + ';'}">Step</span>
        </div>
    </th:block>
</div>
</body>
</html>
