<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Shared head + nav fragments. Pages do:
    <head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
    <nav  th:replace="~{fragments/common :: nav}"></nav>
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- CSRF token for JS-driven /api/intake calls (the signed-URL uploader). Absent in dev (CSRF off). -->
    <meta th:if="${_csrf != null}" name="csrf-token" th:content="${_csrf.token}"/>
    <title th:text="${title} ? |Vishwamitra · ${title}| : 'Vishwamitra'">Vishwamitra</title>
    <!-- Set theme before first paint to avoid a flash of the wrong theme. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
        })();
    </script>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
<div th:fragment="progressbar" id="progress-bar"></div>

<nav th:fragment="nav" class="topnav">
    <a class="brand" th:href="@{/home}"><span class="brand-mark"></span>Vishwamitra</a>
    <button type="button" class="icon-btn nav-burger" aria-label="Toggle menu" data-nav-toggle>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="links" id="navLinks">
        <a th:href="@{/sft}"      th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/sft')} ? 'active'">SFT</a>
        <a th:href="@{/dpo}"      th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/dpo')} ? 'active'">DPO</a>
        <a th:href="@{/export}"   th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/export')} ? 'active'">Export</a>
        <a th:href="@{/import}"   th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/import')} ? 'active'">Import</a>
        <a th:href="@{/intake}"   sec:authorize="hasRole('REVIEWER')"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/intake')} ? 'active'">Intake</a>
        <a th:href="@{/training}" th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/training')} ? 'active'">Training</a>
        <a th:href="@{/models}"   th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/models')} ? 'active'">Models</a>
        <a th:href="@{/admin/tools}" sec:authorize="hasRole('ADMIN')"
           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/admin')} ? 'active'">Admin</a>
    </div>
    <div class="nav-tools">
        <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
            <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
            <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="user" th:if="${currentEmail}">
            <span class="avatar" th:text="${currentEmail != null ? #strings.toUpperCase(#strings.substring(currentEmail, 0, 1)) : '?'}">U</span>
            <span class="user-email" th:text="${currentEmail}">user</span>
            <span class="badge" th:text="${currentRole}">ROLE</span>
            <form method="post" th:action="@{/logout}" class="inline-form">
                <button type="submit" class="icon-btn" aria-label="Sign out" title="Sign out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                </button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="flash">
    <div class="flash ok" th:if="${ok}" th:text="${ok}">ok</div>
    <div class="flash error" th:if="${error}" th:text="${error}">error</div>
</div>

<nav th:fragment="adminnav(active)" class="subnav">
    <a th:href="@{/admin/tools}"        th:classappend="${active == 'tools'} ? 'active'">Tools</a>
    <a th:href="@{/admin/base-models}"  th:classappend="${active == 'base-models'} ? 'active'">Base models</a>
    <a th:href="@{/admin/taxonomy}"     th:classappend="${active == 'taxonomy'} ? 'active'">Taxonomy</a>
    <a th:href="@{/admin/scenarios}"    th:classappend="${active == 'scenarios'} ? 'active'">Scenarios</a>
    <a th:href="@{/admin/users}"        th:classappend="${active == 'users'} ? 'active'">Users</a>
    <a th:href="@{/admin/providers}"    th:classappend="${active == 'providers'} ? 'active'">Providers</a>
    <a th:href="@{/admin/extraction-prompts}" th:classappend="${active == 'extraction-prompts'} ? 'active'">Extraction prompts</a>
</nav>
</body>
</html>
