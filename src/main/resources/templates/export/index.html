<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>
<main class="container wide console">
    <nav th:replace="~{fragments/common :: consolenav('export')}"></nav>
    <div th:replace="~{fragments/common :: flash}"></div>

    <h1>Export</h1>
    <p class="muted">Serialize APPROVED examples to JSONL and write a snapshot to the training bucket.</p>

    <form method="post" th:action="@{/export/run}" class="form">
        <label>Kind
            <select name="kind">
                <option th:each="k : ${kinds}" th:value="${k}" th:text="${k}">SFT</option>
            </select>
        </label>
        <label>Claim type
            <select name="claimType"><option value="">any</option>
                <option th:each="ct : ${T(ai.vishwakarma.labelling.domain.ClaimType).values()}" th:value="${ct.name()}" th:text="${ct.name().toLowerCase()}">ct</option>
            </select>
        </label>
        <label>Authenticity
            <select name="authenticityTier"><option value="">any</option>
                <option th:each="t : ${T(ai.vishwakarma.labelling.domain.AuthenticityTier).values()}" th:value="${t.name()}" th:text="${t.name().toLowerCase()}">t</option>
            </select>
        </label>
        <label>Label
            <input type="text" name="label" list="labelSuggestions" placeholder="any"/>
            <datalist id="labelSuggestions">
                <option th:each="l : ${taxonomy.labels}" th:value="${l}"></option>
            </datalist>
        </label>
        <label>Tool encoding
            <select name="toolEncoding">
                <option th:each="te : ${toolEncodings}" th:value="${te}" th:text="${te.label}"
                        th:selected="${te == defaultEncoding}">enc</option>
            </select>
        </label>
        <button type="submit">Run export</button>
    </form>

    <h2>History</h2>
    <table class="grid">
        <thead><tr><th>When</th><th>Kind</th><th>Count</th><th>URI</th><th>By</th><th></th></tr></thead>
        <tbody>
        <tr th:each="e : ${history}">
            <td class="muted"><time class="js-ts" th:datetime="${e.createdAt}" th:text="${e.createdAt}">ts</time></td>
            <td><span class="badge" th:text="${e.kind}">SFT</span></td>
            <td th:text="${e.count}">0</td>
            <td><code class="copyable" title="Click to copy" th:text="${e.gcsUri}">gs://…</code></td>
            <td class="muted" th:text="${e.createdBy}">by</td>
            <td>
                <form method="post" class="inline-form" th:action="@{'/export/' + ${e.id} + '/delete'}"
                      data-confirm="This removes the JSONL file from the bucket and the record. This cannot be undone."
                      data-confirm-title="Delete this export?" data-confirm-ok="Delete" data-confirm-danger>
                    <button class="btn--danger btn--sm" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${history.isEmpty()}"><td colspan="6"><div class="empty-state">No exports yet — run one above.</div></td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
