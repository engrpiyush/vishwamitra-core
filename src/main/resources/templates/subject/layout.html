<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  VA-32: shared fragments for the subject world (LLD §8 — subject branding, no operator nav).
  Pages keep the .landing scaffold; the footer is the one shared slot. VA-45: the tools nav row
  carries the three public policy links on a second line — every signed-in page gets them here.
-->
<body>

<!-- Signed-in subject pages: tools nav + sign out, the public policy links below. -->
<footer th:fragment="foot" class="landing-foot">
    <div>
        <a th:href="@{/}">Home</a> ·
        <a th:href="@{/training}">Training space</a> ·
        <!-- VA-140: reachable from every signed-in page *while the surface is switched on* — the
             page redirects to the training home when it is off (the flag defaults off outside dev),
             so an ungated link here would be a dead end on every page. `profileEnabled` is set for
             every view by GlobalModelAdvice; absent (a fragment rendered outside it) reads false,
             which hides the link rather than stranding it. Post-submit the page is a read-only
             summary, so the link stays live for the rest of the subject's life. -->
        <th:block th:if="${profileEnabled}">
            <a th:href="@{/training/profile}">Your details</a> ·
        </th:block>
        <a th:href="@{/tokens}">Access codes</a> ·
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="linklike">Sign out</button>
        </form>
    </div>
    <div th:replace="~{public/shell :: policylinks}"></div>
</footer>

</body>
</html>
