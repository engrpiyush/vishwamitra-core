<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{public/shell :: head(${pageTitle})}"></head>
<body>

<!--
  VA-71/VA-45: a §13.3 policy page on the apex — the same public/policy-texts fragment the
  subject hosts publish. No cookie banner here: the apex world is cookieless (stateless chain).
-->
<div class="landing">
    <main class="landing-main">
        <section class="landing-hero policy-page">
            <span class="brand-mark"></span>
            <!-- th:replace outranks th:if, so the conditional include needs the th:block wrapper. -->
            <th:block th:if="${policy == 'tnc'}">
                <div th:replace="~{public/policy-texts :: tnc}"></div>
            </th:block>
            <th:block th:if="${policy == 'privacy'}">
                <div th:replace="~{public/policy-texts :: privacy}"></div>
            </th:block>
            <th:block th:if="${policy == 'cookies'}">
                <div th:replace="~{public/policy-texts :: cookies}"></div>
            </th:block>
        </section>
    </main>
    <footer th:replace="~{public/shell :: publicfoot}"></footer>
</div>

</body>
</html>
