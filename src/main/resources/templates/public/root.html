<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{public/shell :: head(${pageTitle})}"></head>
<body>

<!--
  VA-173: the apex root — the two-door bifurcation (individuals ⟂ business). The public front
  door: friendly capability language only, cookieless (stateless chain), and the host filter 404s
  everything else. Each door opens a same-host use-case catalog (/individuals, /business).
-->
<div class="landing">
    <main class="landing-main">
        <section class="landing-hero landing-hero--wide">
            <span class="brand-mark"></span>
            <h1>Vishwakarma AI</h1>
            <p class="lede">AI built from what you know — every fact verified, and the model
                yours to own.</p>

            <!-- Two doors: individuals first, business second. -->
            <div class="stage-picker">
                <a class="stage-card" th:href="@{/individuals}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="stage-card-title">For individuals</span>
                    <p class="muted">An advocate that speaks for you — grounded in evidence you
                        choose and review.</p>
                </a>
                <a class="stage-card" th:href="@{/business}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01"/></svg>
                    <span class="stage-card-title">For businesses</span>
                    <p class="muted">An AI sales rep built from your company's knowledge — and
                        owned by you.</p>
                </a>
            </div>
        </section>
    </main>
    <footer th:replace="~{public/shell :: publicfoot}"></footer>
</div>

</body>
</html>
