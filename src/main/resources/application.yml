# Vishwamitra-core — labelling & training console.
# Profiles: `dev` (local, OAuth bypassed, Firestore emulator) and `prod` (Cloud Run).
# App-specific config lives under `app.*` and is bound by @ConfigurationProperties in Stage 1+.
spring:
  application:
    name: vishwamitra-core
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Imported tuning datasets can exceed the 1MB default.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

server:
  port: ${PORT:8080}   # Cloud Run injects PORT; default 8080 locally
  # Behind the Cloud Run ALB, TLS terminates at the LB and is forwarded over HTTP. Honor
  # X-Forwarded-Proto/Host so Spring builds https:// absolute URLs (e.g. the OAuth2
  # redirect_uri). Overridable via SERVER_FORWARD_HEADERS_STRATEGY. Harmless locally (no
  # forwarded headers are present in dev).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Google Workspace domain allowed to sign in (independent of the app's URL).
  hosted-domain: ${HOSTED_DOMAIN:vishwakarma.ai}
  auth:
    # Comma-separated emails seeded as ADMIN on startup (e.g. the first operators).
    bootstrap-admins: ${BOOTSTRAP_ADMINS:piyush@vishx.com}
  gcp:
    project-id: ${GCP_PROJECT_ID:vishwakarma-ai-poc}
    region: ${GCP_REGION:asia-southeast1}
    firestore-database: ${FIRESTORE_DATABASE:vishwakarma-labelling}
    training-bucket: ${TRAINING_BUCKET:va-ai-training-vishwakarma-ai-poc}
    serving-bucket: ${SERVING_BUCKET:va-ai-serving-vishwakarma-ai-poc}
    # Raw Stage 1 intake assets (binary, possibly multi-GB A/V). Separate bucket/lifecycle from
    # the training JSONL. Browser uploads directly via V4 signed URLs (see IntakeStorage).
    intake-bucket: ${INTAKE_BUCKET:va-ai-intake-vishwakarma-ai-poc}
    # Vertex location for Gemini calls. "global" reaches models not served regionally — Neo is a
    # POC and wants the deepest judgment available (gemini-2.5-pro is not in asia-southeast1), so
    # global is the default. Set blank/region to pin processing in-region.
    gemini-location: ${GEMINI_LOCATION:global}
  intake:
    max-asset-size-bytes: ${INTAKE_MAX_ASSET_SIZE_BYTES:5368709120} # 5GB
    stale-upload-hours: ${INTAKE_STALE_UPLOAD_HOURS:24}
  # Tuning recipe defaults (see continue-tune.sh): foundation omits customBaseModel.
  tuning:
    base-model: ${TUNING_BASE_MODEL:qwen/qwen3@qwen3-32b}
  # Stage 2 (A/V → Claims): managed transcription + Claude claim extraction.
  stage2:
    # STT batchRecognize writes diarized transcripts here (separate lifecycle from intake media).
    transcripts-bucket: ${TRANSCRIPTS_BUCKET:va-ai-transcripts-vishwakarma-ai-poc}
    # Diarization support varies by model and region; see SpeechToTextTranscriber.
    stt-model: ${STAGE2_STT_MODEL:long}
    stt-language: ${STAGE2_STT_LANGUAGE:en-US}
    max-speakers: ${STAGE2_MAX_SPEAKERS:6}
    # Assumed source parameters for containers that need explicitDecodingConfig (AAC family).
    explicit-sample-rate-hertz: ${STAGE2_EXPLICIT_SAMPLE_RATE_HERTZ:48000}
    explicit-channel-count: ${STAGE2_EXPLICIT_CHANNEL_COUNT:2}
  # Cross-site origins allowed to call the coming-soon subscribe API (the page is same-origin).
  coming-soon:
    cors-origins: ${COMING_SOON_CORS_ORIGINS:https://*.vishwakarma.ai,https://vishwakarma.ai}

---
# Local development: OAuth bypassed, Firestore emulator expected on localhost:8081.
spring:
  config:
    activate:
      on-profile: dev

app:
  auth:
    dev-bypass: true
    dev-user:
      email: dev@vishwakarma.ai
      role: ADMIN
  gcp:
    # Blank locally so intake uploads use IntakeStorage's local-disk fallback (var/intake/)
    # instead of minting GCS signed URLs, which need real credentials.
    intake-bucket: ""
  tuning:
    enabled: true     # allowed locally, but…
    dry-run: true     # …simulated — never calls Vertex / spends credits in dev
  stage2:
    transcripts-bucket: ""   # no GCP locally
    dry-run: true            # canned diarized transcript — never calls Speech-to-Text in dev

---
# Cloud Run production.
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

app:
  auth:
    dev-bypass: false
  tuning:
    enabled: true   # real Vertex tuningJobs are submitted in prod
  stage2:
    dry-run: false  # real Speech-to-Text batchRecognize in prod
