# Vishwamitra-core — labelling & training console.
# Profiles: `dev` (local, OAuth bypassed, Firestore emulator) and `prod` (Cloud Run).
# App-specific config lives under `app.*` and is bound by @ConfigurationProperties in Stage 1+.
spring:
  application:
    name: vishwamitra-core
  threads:
    virtual:
      enabled: true
  # VA-41 (LLD §11.1): Gmail SMTP with an app password (owner one-time: 2FA on the account,
  # SPF include:_spf.google.com, Workspace DKIM). Dev never sends — the dev profile wires the
  # logger transport regardless of this block.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:info@vishx.com}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  servlet:
    multipart:
      # Imported tuning datasets can exceed the 1MB default.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

server:
  port: ${PORT:8080}   # Cloud Run injects PORT; default 8080 locally
  # Behind the Cloud Run ALB, TLS terminates at the LB and is forwarded over HTTP. Honor
  # X-Forwarded-Proto/Host so Spring builds https:// absolute URLs (e.g. the OAuth2
  # redirect_uri). Overridable via SERVER_FORWARD_HEADERS_STRATEGY. Harmless locally (no
  # forwarded headers are present in dev).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Google Workspace domain allowed to sign in (independent of the app's URL).
  hosted-domain: ${HOSTED_DOMAIN:vishwakarma.ai}
  auth:
    # Comma-separated emails seeded as ADMIN on startup (e.g. the first operators).
    bootstrap-admins: ${BOOTSTRAP_ADMINS:piyush@vishx.com}
  gcp:
    project-id: ${GCP_PROJECT_ID:vishwakarma-ai-poc}
    region: ${GCP_REGION:asia-southeast1}
    firestore-database: ${FIRESTORE_DATABASE:vishwakarma-labelling}
    training-bucket: ${TRAINING_BUCKET:va-ai-training-vishwakarma-ai-poc}
    serving-bucket: ${SERVING_BUCKET:va-ai-serving-vishwakarma-ai-poc}
    # Raw Stage 1 intake assets (binary, possibly multi-GB A/V). Separate bucket/lifecycle from
    # the training JSONL. Browser uploads directly via V4 signed URLs (see IntakeStorage).
    intake-bucket: ${INTAKE_BUCKET:va-ai-intake-vishwakarma-ai-poc}
    # Vertex location for Gemini calls. "global" reaches models not served regionally — Neo is a
    # POC and wants the deepest judgment available (gemini-2.5-pro is not in asia-southeast1), so
    # global is the default. Set blank/region to pin processing in-region.
    gemini-location: ${GEMINI_LOCATION:global}
    # Retry ladder (ms, comma-separated) for Vertex/Gemini 429+5xx — e.g.
    # "1000,2000,4000,8000,16000,32000" spans a per-minute quota window. Unset = backoff DISABLED
    # (first failure propagates; the run FAILs and Retry resumes).
    vertex-backoff-ms: ${VERTEX_BACKOFF_MS:}
    # generateContent door for judge/extraction/drafting: vertex (ADC, DSQ shared pool) or
    # gemini-api (Developer API: fixed paid-tier quotas, needs GEMINI_API_KEY, global processing).
    # Embeddings have their own switch (app.stage3.embedding-transport).
    gemini-transport: ${GEMINI_TRANSPORT:vertex}
    gemini-api-key: ${GEMINI_API_KEY:}
  intake:
    max-asset-size-bytes: ${INTAKE_MAX_ASSET_SIZE_BYTES:5368709120} # 5GB
    stale-upload-hours: ${INTAKE_STALE_UPLOAD_HOURS:24}
  # Tuning recipe defaults (see continue-tune.sh): foundation omits customBaseModel.
  tuning:
    base-model: ${TUNING_BASE_MODEL:qwen/qwen3@qwen3-32b}
    # tuningJobs location; blank = app.gcp.region. The 2B-class Qwen catalog entries live only
    # in us-central1 — set TUNING_REGION=us-central1 to tune them (dataset/output gs:// URIs
    # stay on the home-region buckets; GCS access is IAM-, not region-gated).
    region: ${TUNING_REGION:}
  # Serving control plane (VA-67): deploy a tuned advocate onto the shared Vertex endpoint and tear
  # it down. Backend-agnostic (Vertex now; AWS later). Defaults are the VA-74-probed V100 pins;
  # endpoint-id + image are required in prod to actually deploy (empty ⇒ serve returns a clear
  # error). A deployed replica bills until torn down — teardown is the cost guard.
  serving:
    enabled: ${SERVING_ENABLED:false}
    dry-run: ${SERVING_DRYRUN:false}
    backend: ${SERVING_BACKEND:vertex}
    region: ${SERVING_REGION:us-central1}
    endpoint-id: ${SERVING_ENDPOINT_ID:}
    image: ${SERVING_IMAGE:}
    # Serving-region checkpoint staging (VA-75/VA-38): registration copies weights here once so
    # window deploys fetch in-region. Blank (dev) = no copy, the source URI serves as-is.
    staging-bucket: ${SERVING_STAGING_BUCKET:}
    # PROVISIONING older than this flips to DEPLOY_FAILED (measured cold deploy is 25–35 min).
    deploy-timeout: ${SERVING_DEPLOY_TIMEOUT:60m}
  # Stage 2 (A/V → Claims): managed transcription + Claude claim extraction.
  stage2:
    # STT batchRecognize writes diarized transcripts here (separate lifecycle from intake media).
    transcripts-bucket: ${TRANSCRIPTS_BUCKET:va-ai-transcripts-vishwakarma-ai-poc}
    # Diarization support varies by model and region; see SpeechToTextTranscriber.
    stt-model: ${STAGE2_STT_MODEL:long}
    stt-language: ${STAGE2_STT_LANGUAGE:en-US}
    max-speakers: ${STAGE2_MAX_SPEAKERS:6}
    # Assumed source parameters for containers that need explicitDecodingConfig (AAC family).
    explicit-sample-rate-hertz: ${STAGE2_EXPLICIT_SAMPLE_RATE_HERTZ:48000}
    explicit-channel-count: ${STAGE2_EXPLICIT_CHANNEL_COUNT:2}
    # IMAGE/DOCUMENT lane cap: bytes ride inline (base64) in the Gemini request (~20MB total).
    max-document-bytes: ${STAGE2_MAX_DOCUMENT_BYTES:14680064}
  # Stage 3 (Claims → Authenticity graph/scores): Neo4j connection + the LLD §8.2 knobs (the full
  # table, with defaults, lives in AppProperties.Stage3 — only env-wired keys repeat here).
  # NEO4J_* env names match what vishwamitra-infra injects on Cloud Run: in Aura mode (Option 1,
  # current) NEO4J_URI/NEO4J_PASSWORD come from the operator-created Secret Manager secrets
  # (NEO4J_DB_URL / NEO4J_DB_SECRET) once neo4j_wire_app=true; no VPC/egress config is involved —
  # Cloud Run reaches the neo4j+s:// TLS endpoint directly.
  stage3:
    neo4j-uri: ${NEO4J_URI:bolt://localhost:7687}
    neo4j-user: ${NEO4J_USER:neo4j}
    # Empty default outside dev: a missing secret fails the ping guard loudly instead of trying a
    # default password against Aura. The dev profile overrides to compose.yaml's pair below.
    neo4j-password: ${NEO4J_PASSWORD:}
    neo4j-database: ${NEO4J_DATABASE:neo4j}
    # Blank = app region (asia-southeast1). Embedding models are served regionally — override
    # (e.g. us-central1) if the home region lacks gemini-embedding-001.
    embedding-location: ${STAGE3_EMBEDDING_LOCATION:}
    embedding-dimensions: ${STAGE3_EMBEDDING_DIMENSIONS:3072}
    # vertex (ADC, in-region — but gemini-embedding is quota'd 5 RPM everywhere in this project)
    # or gemini-api (Developer API: same model/space, paid-tier 3000 RPM, needs GEMINI_API_KEY,
    # processed globally). Same version stamp either way — switching never re-embeds.
    embedding-transport: ${STAGE3_EMBEDDING_TRANSPORT:vertex}
    gemini-api-key: ${GEMINI_API_KEY:}
    dry-run: ${STAGE3_DRY_RUN:false}
  # Cross-site origins allowed to call the coming-soon subscribe API (the page is same-origin).
  coming-soon:
    cors-origins: ${COMING_SOON_CORS_ORIGINS:https://*.vishwakarma.ai,https://vishwakarma.ai}
  # vishwakarma.ai product face (LLD §17.1): subject hosts <handle>.{base-domain} split from the
  # operator app by host-first routing (VA-30); product mail + internal-endpoint auth (VA-41).
  product:
    base-domain: ${PRODUCT_BASE_DOMAIN:vishwakarma.ai}
    operator-domain: ${PRODUCT_OPERATOR_DOMAIN:labelling.vishwakarma.ai}
    mail-daily-cap: ${PRODUCT_MAIL_DAILY_CAP:200}
    mail-from: ${PRODUCT_MAIL_FROM:info@vishx}
    # Guest tokens & wall (VA-36, LLD §6): the pepper comes from Secret Manager (§3.3); blank
    # outside dev = token generation/redemption fail closed. Dev pins a fixed value below.
    token-cap: ${PRODUCT_TOKEN_CAP:10}
    guest-session-ttl: ${PRODUCT_GUEST_SESSION_TTL:60m}
    wall-attempts-per-minute: ${PRODUCT_WALL_ATTEMPTS_PER_MINUTE:5}
    wall-lockout: ${PRODUCT_WALL_LOCKOUT:15m}
    token-pepper: ${ADVOCATE_TOKEN_PEPPER:}
    # OIDC audience the /internal/** sweep endpoints require (the Cloud Run URL); blank outside
    # dev = those endpoints fail closed. The invoker pin is the scheduler SA email (optional).
    internal-audience: ${INTERNAL_AUDIENCE:}
    internal-invoker: ${INTERNAL_INVOKER:}

---
# Local development: OAuth bypassed, Firestore emulator expected on localhost:8081.
spring:
  config:
    activate:
      on-profile: dev

app:
  auth:
    dev-bypass: true
    # Dev fixtures (dev subject + SUBJECT login + LIVE advocate) seed only on an explicit
    # DEV_SEED=true boot — the usual dev datastore is a restored emulator snapshot.
    dev-seed: ${DEV_SEED:false}
    dev-user:
      email: admin@vishwakarma.ai
      role: ADMIN
  gcp:
    # Blank locally so intake uploads use IntakeStorage's local-disk fallback (var/intake/)
    # instead of minting GCS signed URLs, which need real credentials.
    intake-bucket: ""
  tuning:
    enabled: true     # allowed locally, but…
    dry-run: true     # …simulated — never calls Vertex / spends credits in dev
  serving:
    enabled: true     # serving controls visible locally, but…
    dry-run: true     # …simulated deploy/teardown — never calls Vertex / bills a replica in dev
  stage2:
    transcripts-bucket: ""   # no GCP locally
    dry-run: true            # canned diarized transcript — never calls Speech-to-Text in dev
  stage3:
    # compose.yaml's dev pair; Neo4j itself is ALWAYS real locally (docker compose up -d neo4j) —
    # dry-run stubs only the LLM legs (pseudo embeddings now; canned judge/extraction with VA-19).
    neo4j-password: ${NEO4J_PASSWORD:vishwamitra-dev}
    dry-run: true
  stage4:
    dry-run: true   # offline generator/judge doubles — never calls Gemini in dev
  product:
    # Subject world on <handle>.localhost:8080 (Chrome/Firefox resolve *.localhost natively);
    # plain localhost:8080 stays the operator app.
    base-domain: localhost
    operator-domain: localhost
    # Fixed dev pepper (NOT a secret): hashes in the emulator stay stable across restarts so
    # seeded/manual tokens keep resolving. Real environments must set ADVOCATE_TOKEN_PEPPER.
    token-pepper: dev-pepper-fixed-for-emulator-hashes

---
# Cloud Run production.
server:
  servlet:
    session:
      cookie:
        # VA-70 (LLD §4.2 v1.1): the login session is minted on auth.vishwakarma.ai and must be
        # honored on every subject host, so the cookie is parent-domain in prod only (dev stays
        # host-only). Authorization is untouched — the §4.4 SUBJECT_ID-of-host check still 403s
        # a valid session on the wrong host. CSRF holds: tokens live in the (now shared) session.
        domain: ${SESSION_COOKIE_DOMAIN:.vishwakarma.ai}

spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

app:
  auth:
    dev-bypass: false
  tuning:
    enabled: true   # real Vertex tuningJobs are submitted in prod
  serving:
    enabled: ${SERVING_ENABLED:true}  # real endpoint deploy/undeploy; needs endpoint-id + image
    dry-run: ${SERVING_DRYRUN:false}
  stage2:
    dry-run: false  # real Speech-to-Text batchRecognize in prod
  stage3:
    dry-run: false  # real Vertex embeddings/judge in prod; graph = AuraDB via NEO4J_* env
  stage4:
    dry-run: false  # real Gemini generation/judge in prod
